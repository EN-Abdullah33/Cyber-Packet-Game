<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Packet Deluxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #030712;
            color: #f9fafb;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: linear-gradient(180deg, #090d16 0%, #050b14 100%);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="game-container p-2 sm:p-4">
        <canvas id="gameCanvas" width="360" height="640"></canvas>
    </div>

    <script>
        // --- Web Audio API Synthesizer (No External Files) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playCoin() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playShieldPickup() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playShieldBreak() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playGameOver() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }
        }

        // --- Game Setup ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const audio = new SoundFX();

        let gameState = "START"; // START, PLAYING, GAMEOVER
        let speed = 4;
        let score = 0;
        let coinsCollected = 0;
        let highScore = parseInt(localStorage.getItem("cyber_packet_highscore")) || 0;
        let frameCount = 0;

        // Player Specs
        let player = {
            x: 50,
            y: 480,
            width: 32,
            height: 32,
            dy: 0,
            jumpForce: -12,
            gravity: 0.65,
            grounded: false,
            color: "#38bdf8",
            shieldActive: false,
            shieldTimer: 0,
            maxShieldTime: 300 // 5 Seconds (60 FPS * 5)
        };

        let obstacles = [];
        let coins = [];
        let shields = [];
        let particles = [];
        let backgroundNodes = [];

        // Generate background grid/nodes
        for (let i = 0; i < 25; i++) {
            backgroundNodes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                alpha: Math.random() * 0.5 + 0.1,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        // --- Touch & Mouse Event Handlers ---
        window.addEventListener("touchstart", handleInteraction, { passive: false });
        window.addEventListener("mousedown", handleInteraction);

        function handleInteraction(e) {
            if (e.type === "touchstart") e.preventDefault();
            audio.init();

            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
                return;
            }

            if (gameState === "PLAYING" && player.grounded) {
                player.dy = player.jumpForce;
                player.grounded = false;
                audio.playJump();
                createParticles(player.x + 16, player.y + 32, "#38bdf8", 10);
            }
        }

        function resetGame() {
            player.y = 480;
            player.dy = 0;
            player.shieldActive = false;
            player.shieldTimer = 0;
            obstacles = [];
            coins = [];
            shields = [];
            particles = [];
            score = 0;
            coinsCollected = 0;
            speed = 4.2;
            frameCount = 0;
        }

        function createParticles(x, y, color, count, speedMultiplier = 1) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5 * speedMultiplier,
                    vy: (Math.random() - 0.5) * 5 * speedMultiplier,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: Math.random() * 20 + 10
                });
            }
        }

        // --- Main Render & Game Loop ---
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background Motion
            ctx.fillStyle = "#38bdf8";
            backgroundNodes.forEach(node => {
                node.x -= node.speed * (gameState === "PLAYING" ? speed * 0.3 : 1);
                if (node.x < 0) node.x = canvas.width;
                ctx.globalAlpha = node.alpha;
                ctx.fillRect(node.x, node.y, node.size, node.size);
            });
            ctx.globalAlpha = 1.0;

            // 2. Draw Ground Line (Grid Cyber Floor)
            const groundY = 512;
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 3;
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Handle States
            if (gameState === "START") {
                renderStartScreen();
                requestAnimationFrame(loop);
                return;
            }

            if (gameState === "PLAYING") {
                frameCount++;

                // Speed progression
                if (frameCount % 240 === 0) speed += 0.25;

                // Player Physics
                player.dy += player.gravity;
                player.y += player.dy;

                if (player.y >= groundY - player.height) {
                    player.y = groundY - player.height;
                    player.dy = 0;
                    player.grounded = true;
                }

                // Shield Timer Logic
                if (player.shieldActive) {
                    player.shieldTimer--;
                    if (player.shieldTimer <= 0) {
                        player.shieldActive = false;
                        audio.playShieldBreak();
                        createParticles(player.x + 16, player.y + 16, "#3b82f6", 15);
                    }
                }

                // Spawn Particles Trail for Player
                if (frameCount % 3 === 0) {
                    particles.push({
                        x: player.x,
                        y: player.y + Math.random() * player.height,
                        vx: -speed * 0.5,
                        vy: (Math.random() - 0.5) * 1,
                        size: Math.random() * 3 + 1,
                        color: player.shieldActive ? "#60a5fa" : "#38bdf8",
                        life: 15
                    });
                }

                // Spawning Spawns (Obstacles, Coins, Shields)
                // Obstacles (Firewalls)
                if (frameCount % Math.max(50, 110 - Math.floor(speed * 4)) === 0) {
                    let h = Math.random() * 45 + 35;
                    obstacles.push({
                        x: canvas.width,
                        y: groundY - h,
                        width: 24,
                        height: h,
                        color: "#ef4444"
                    });
                }

                // Data Coins (Green Orbs)
                if (frameCount % 130 === 0) {
                    coins.push({
                        x: canvas.width,
                        y: Math.random() * 120 + 330,
                        size: 10,
                        pulse: 0
                    });
                }

                // Shield Power-up (Blue Orb)
                if (frameCount % 450 === 0 && !player.shieldActive) {
                    shields.push({
                        x: canvas.width,
                        y: Math.random() * 100 + 320,
                        size: 12
                    });
                }

                // Render & Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    if (p.life <= 0) particles.splice(i, 1);
                }

                // Render & Update Shields
                for (let i = shields.length - 1; i >= 0; i--) {
                    let s = shields[i];
                    s.x -= speed;

                    // Collision with player
                    if (
                        player.x < s.x + s.size &&
                        player.x + player.width > s.x - s.size &&
                        player.y < s.y + s.size &&
                        player.y + player.height > s.y - s.size
                    ) {
                        player.shieldActive = true;
                        player.shieldTimer = player.maxShieldTime;
                        audio.playShieldPickup();
                        createParticles(s.x, s.y, "#3b82f6", 20, 1.5);
                        shields.splice(i, 1);
                        continue;
                    }

                    ctx.fillStyle = "#3b82f6";
                    ctx.shadowColor = "#60a5fa";
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (s.x < -20) shields.splice(i, 1);
                }

                // Render & Update Coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    let c = coins[i];
                    c.x -= speed;
                    c.pulse += 0.08;

                    // Collision with player
                    if (
                        player.x < c.x + c.size &&
                        player.x + player.width > c.x - c.size &&
                        player.y < c.y + c.size &&
                        player.y + player.height > c.y - c.size
                    ) {
                        coinsCollected++;
                        audio.playCoin();
                        createParticles(c.x, c.y, "#10b981", 12);
                        coins.splice(i, 1);
                        continue;
                    }

                    let radius = c.size + Math.sin(c.pulse) * 2;
                    ctx.fillStyle = "#10b981";
                    ctx.shadowColor = "#34d399";
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (c.x < -20) coins.splice(i, 1);
                }

                // Render & Update Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= speed;

                    // Collision check
                    if (
                        player.x < obs.x + obs.width &&
                        player.x + player.width > obs.x &&
                        player.y < obs.y + obs.height &&
                        player.y + player.height > obs.y
                    ) {
                        if (player.shieldActive) {
                            // Shield saves the player!
                            player.shieldActive = false;
                            player.shieldTimer = 0;
                            audio.playShieldBreak();
                            createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, "#ef4444", 20, 2);
                            obstacles.splice(i, 1);
                            continue;
                        } else {
                            // Game Over
                            audio.playGameOver();
                            createParticles(player.x + 16, player.y + 16, "#ef4444", 30, 2);
                            gameState = "GAMEOVER";
                            let finalScore = score + (coinsCollected * 5);
                            if (finalScore > highScore) {
                                highScore = finalScore;
                                localStorage.setItem("cyber_packet_highscore", highScore);
                            }
                        }
                    }

                    // Draw Firewall
                    ctx.fillStyle = obs.color;
                    ctx.shadowColor = "#f87171";
                    ctx.shadowBlur = 12;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.shadowBlur = 0;

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                        score += 1;
                    }
                }

                // Draw Player Body
                ctx.fillStyle = player.color;
                ctx.shadowColor = player.color;
                ctx.shadowBlur = 14;
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.shadowBlur = 0;

                // Draw Shield Barrier Aura if active
                if (player.shieldActive) {
                    ctx.strokeStyle = "#60a5fa";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#93c5fd";
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(player.x + 16, player.y + 16, 26, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Render Game HUD
                renderHUD();
            }

            if (gameState === "GAMEOVER") {
                renderGameOverScreen();
            }

            requestAnimationFrame(loop);
        }

        // --- Interface Screens ---
        function renderHUD() {
            // Score & Coins
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px Tajawal, sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("النقاط: " + score, canvas.width - 20, 40);

            ctx.fillStyle = "#34d399";
            ctx.fillText("البيانات: " + coinsCollected, canvas.width - 20, 65);

            // Shield Bar Display
            if (player.shieldActive) {
                const barWidth = 100;
                const progress = (player.shieldTimer / player.maxShieldTime) * barWidth;
                
                ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
                ctx.fillRect(20, 30, barWidth, 10);
                
                ctx.fillStyle = "#60a5fa";
                ctx.shadowColor = "#93c5fd";
                ctx.shadowBlur = 8;
                ctx.fillRect(20, 30, progress, 10);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#93c5fd";
                ctx.font = "bold 12px Tajawal";
                ctx.textAlign = "left";
                ctx.fillText("الدرع نشط", 20, 24);
            }
        }

        function renderStartScreen() {
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.font = "bold 30px Tajawal, sans-serif";
            ctx.fillText("Cyber Packet", canvas.width / 2, 210);

            ctx.fillStyle = "#38bdf8";
            ctx.font = "bold 18px Tajawal";
            ctx.fillText("Deluxe Edition", canvas.width / 2, 240);

            // Highscore
            ctx.fillStyle = "#fbbf24";
            ctx.font = "16px Tajawal";
            ctx.fillText("أعلى نتيجة: " + highScore, canvas.width / 2, 280);

            // Instructions Box
            ctx.fillStyle = "rgba(30, 41, 59, 0.8)";
            ctx.fillRect(40, 330, canvas.width - 80, 140);
            
            ctx.fillStyle = "#f3f4f6";
            ctx.font = "14px Tajawal";
            ctx.fillText("• المس الشاشة للقفز وتفادي الجدران", canvas.width / 2, 365);
            ctx.fillText("• اجمع البيانات الخضراء لزيادة النقاط", canvas.width / 2, 395);
            ctx.fillText("• احصل على الكبسولة الزرقاء لتفعيل الدرع", canvas.width / 2, 425);

            ctx.fillStyle = "#38bdf8";
            ctx.font = "bold 18px Tajawal";
            ctx.fillText("المس الشاشة للبدء!", canvas.width / 2, 530);
        }

        function renderGameOverScreen() {
            ctx.fillStyle = "rgba(3, 7, 18, 0.88)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ef4444";
            ctx.font = "bold 32px Tajawal, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("انتهت اللعبة!", canvas.width / 2, 210);

            let totalFinal = score + (coinsCollected * 5);
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Tajawal";
            ctx.fillText("المجموع: " + totalFinal, canvas.width / 2, 270);

            ctx.fillStyle = "#fbbf24";
            ctx.font = "16px Tajawal";
            ctx.fillText("أعلى نتيجة: " + highScore, canvas.width / 2, 310);

            // Retry Button
            ctx.fillStyle = "#0284c7";
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 15;
            ctx.fillRect(canvas.width / 2 - 80, 370, 160, 48);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px Tajawal";
            ctx.fillText("إعادة المحاولة", canvas.width / 2, 400);
        }

        // Start Loop
        loop();
    </script>
</body>
</html>
